<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 90" width="420" height="90">
  <defs>
    <linearGradient id="wordGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#1A0533"/>
      <stop offset="100%" stop-color="#3B0764"/>
    </linearGradient>
    <linearGradient id="limeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#C6F135"/>
      <stop offset="100%" stop-color="#A8E63D"/>
    </linearGradient>
    <filter id="limeShadow" x="-5%" y="-20%" width="115%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#C6F135" flood-opacity="0.40"/>
    </filter>
  </defs>

  <!-- Wordmark -->
  <text x="4" y="62"
        font-family="'Helvetica Neue', 'Arial', sans-serif"
        font-size="58"
        letter-spacing="-1.5">
    <tspan font-weight="800" fill="url(#wordGrad)">Share</tspan><tspan font-weight="300" fill="#1A0533">plattr</tspan>
  </text>


  <!-- Tagline -->
  <text x="5" y="85"
        font-family="'Helvetica Neue', 'Arial', sans-serif"
        font-size="10.5"
        font-weight="500"
        letter-spacing="5"
        fill="#6B21A8"
        opacity="0.75">YOUR PLATFORM · YOUR RULES</text>
</svg>
