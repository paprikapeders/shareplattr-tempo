services:
  app:
    image: shareplattr-prod-app
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    command: >
      sh -lc "mkdir -p
      storage/app/public
      storage/framework/cache/data
      storage/framework/sessions
      storage/framework/testing
      storage/framework/views
      storage/logs
      storage/temp
      bootstrap/cache
      && chown -R www-data:www-data storage bootstrap/cache
      && php-fpm"
    volumes:
      - ./:/var/www
      - app_storage:/var/www/storage
      - bootstrap_cache:/var/www/bootstrap/cache
      - vendor_data:/var/www/vendor
      - node_modules_data:/var/www/node_modules
      - vite_build:/var/www/public/build
    networks:
      - shareplattr_internal
    depends_on:
      - db

  queue:
    image: shareplattr-prod-app
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    command: >
      sh -lc "mkdir -p
      storage/app/public
      storage/framework/cache/data
      storage/framework/sessions
      storage/framework/testing
      storage/framework/views
      storage/logs
      storage/temp
      bootstrap/cache
      && chown -R www-data:www-data storage bootstrap/cache
      && php artisan queue:work --sleep=3 --tries=3 --timeout=90"
    volumes:
      - ./:/var/www
      - app_storage:/var/www/storage
      - bootstrap_cache:/var/www/bootstrap/cache
      - vendor_data:/var/www/vendor
      - node_modules_data:/var/www/node_modules
      - vite_build:/var/www/public/build
    networks:
      - shareplattr_internal
    depends_on:
      - app
      - db

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./:/var/www:ro
      - app_storage:/var/www/storage:ro
      - vite_build:/var/www/public/build:ro
      - ./nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - shareplattr_internal
    depends_on:
      - app

  db:
    image: mysql:8.0
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - shareplattr_internal

volumes:
  app_storage:
  bootstrap_cache:
  vendor_data:
  node_modules_data:
  vite_build:
  db_data:

networks:
  shareplattr_internal:
    driver: bridge
